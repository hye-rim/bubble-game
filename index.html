<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>퍼즐 버블</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  /* 작은 오락실 공통 스티커 스타일: 진한 남보라 테두리 + 아래로 떨어진 그림자 + 둥근 글꼴 */
  :root { --ink:#2b1d52; --yellow:#ffd23f; --pink:#ff5fa2; --muted:#6b5c95; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:
      repeating-linear-gradient(-30deg, rgba(255,255,255,.07) 0 26px, transparent 26px 56px),
      linear-gradient(180deg, #4f8cff 0%, #6b5cff 55%, #8a4fe0 100%);
    font-family:'Jua', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color:var(--ink);
    touch-action:none;
  }
  #stage {
    width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:10px;
  }
  /* 위 점수판: 알약들 */
  #hud { display:flex; align-items:center; gap:6px; padding:0 2px 12px; font-variant-numeric:tabular-nums; }
  #hud .item {
    display:flex; align-items:baseline; gap:5px; white-space:nowrap;
    background:#fff; border:3px solid var(--ink); border-radius:999px; box-shadow:0 4px 0 var(--ink);
    padding:2px 11px;
  }
  #hud .item:first-child { background:var(--yellow); flex:1; min-width:0; }
  #hud .label { font-size:11px; color:var(--muted); }
  #hud .value { font-size:20px; }
  #hud .icons { display:flex; gap:6px; margin-left:auto; }
  #hud button {
    background:#fff; border:3px solid var(--ink); color:var(--ink);
    width:36px; height:36px; border-radius:12px; font-size:15px; cursor:pointer;
    box-shadow:0 4px 0 var(--ink);
  }
  #hud button:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  /* 좁은 화면: 알약 이름표를 빼고 숫자만 */
  @media (max-width:360px) {
    #hud .label { display:none; }
    #hud .item { padding:2px 9px; }
    #hud button { width:32px; height:32px; font-size:13px; }
  }
  #wrap { position:relative; }
  #game {
    display:block;
    border-radius:20px;
    box-shadow:0 0 0 4px var(--ink), 0 9px 0 4px var(--ink), 0 22px 40px rgba(0,0,0,.35);
    touch-action:none;
    cursor:crosshair;
  }
  #overlay {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:safe center; gap:12px;
    text-align:center; padding:20px;
    background:rgba(43,29,82,.58);
    border-radius:20px;
    backdrop-filter:blur(3px);
    overflow-y:auto;
  }
  #overlay.hidden { display:none; }
  #overlay h1, .inked {
    color:#fff; font-weight:400; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink);
  }
  #overlay h1 { font-size:clamp(40px, 12vw, 52px); line-height:1.05; }
  #overlay h2 { font-size:30px; font-weight:400; }
  #overlay p { font-size:15px; color:#fff; line-height:1.6; }
  #overlay p b { color:var(--yellow); font-weight:400; }
  #overlay .big { font-size:36px; color:var(--yellow); line-height:1.1; }
  #overlay .help {
    font-size:14px; color:var(--ink); line-height:1.75;
    background:#fff; border:3px solid var(--ink); border-radius:18px; box-shadow:0 5px 0 var(--ink);
    padding:10px 16px; margin-top:2px;
  }
  #overlay button {
    margin-top:6px;
    background:var(--yellow); color:var(--ink); font-size:22px; font-family:inherit;
    border:3px solid var(--ink); border-radius:999px; padding:10px 38px;
    box-shadow:0 6px 0 var(--ink); cursor:pointer;
  }
  #overlay button:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
</style>
</head>
<body>
<div id="stage">
  <div id="col">
    <div id="hud">
      <div class="item"><span class="label">SCORE</span><span class="value" id="score">0</span></div>
      <div class="item mid"><span class="label">STAGE</span><span class="value" id="stageNo">1</span></div>
      <div class="item right">
        <span class="label">BEST</span><span class="value" id="best">0</span>
      </div>
      <div class="icons">
        <button id="muteBtn" title="소리 (M)">🔊</button>
        <button id="pauseBtn" title="일시정지 (P)">⏸</button>
      </div>
    </div>
    <div id="wrap">
      <canvas id="game"></canvas>
      <div id="overlay">
        <h1>퍼즐 버블</h1>
        <p>같은 색 구슬을 <b>3개 이상</b> 붙여서 터뜨리세요!<br>매달린 구슬까지 떨어뜨리면 보너스 점수 💥</p>
        <div class="help">
          🖱️ 마우스로 조준 · 클릭 발사<br>
          📱 드래그로 조준 · 손을 떼면 발사<br>
          ⌨️ ← → 조준 · Space 발사 · ↓ 구슬 교체<br>
          NEXT 구슬을 누르면 바꿀 수 있어요
        </div>
        <button id="startBtn">시작하기</button>
      </div>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
