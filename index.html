<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>퍼즐 버블</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:radial-gradient(circle at 50% 20%, #2a1f5c 0%, #120d2b 60%, #07051a 100%);
    font-family:-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color:#fff;
    touch-action:none;
  }
  #stage {
    width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:8px;
  }
  #hud {
    display:flex; justify-content:space-between; align-items:flex-end; gap:8px;
    padding:0 4px 6px;
    font-variant-numeric:tabular-nums;
  }
  #hud .item { display:flex; flex-direction:column; line-height:1.1; }
  #hud .item.mid { align-items:center; }
  #hud .item.right { align-items:flex-end; }
  #hud .label { font-size:10px; letter-spacing:.12em; color:#a99ce8; font-weight:700; }
  #hud .value { font-size:20px; font-weight:800; }
  #hud .icons { display:flex; gap:6px; }
  #hud button {
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); color:#fff;
    width:30px; height:30px; border-radius:8px; font-size:14px; cursor:pointer;
  }
  #wrap { position:relative; }
  #game {
    display:block;
    border-radius:10px;
    box-shadow:0 0 0 3px #4b3b9a, 0 0 0 6px #1c1440, 0 12px 40px rgba(0,0,0,.6);
    touch-action:none;
    cursor:crosshair;
  }
  #overlay {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    text-align:center; padding:20px;
    background:rgba(10,6,30,.78);
    border-radius:10px;
    backdrop-filter:blur(2px);
  }
  #overlay.hidden { display:none; }
  #overlay h1 { font-size:34px; font-weight:900; letter-spacing:.02em;
    background:linear-gradient(180deg,#fff 0%,#ffd93d 55%,#ff9f1c 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 3px 0 #6a2a00); }
  #overlay h2 { font-size:26px; font-weight:900; }
  #overlay p { font-size:14px; color:#d6cffc; line-height:1.6; }
  #overlay .big { font-size:18px; font-weight:800; color:#ffd93d; }
  #overlay .help { font-size:12px; color:#a99ce8; line-height:1.7; margin-top:4px; }
  #overlay button {
    margin-top:8px;
    background:linear-gradient(180deg,#ffd93d,#ff9f1c);
    color:#3a1a00; font-weight:900; font-size:17px;
    border:none; border-radius:999px; padding:12px 34px;
    box-shadow:0 4px 0 #a55a00; cursor:pointer;
  }
  #overlay button:active { transform:translateY(3px); box-shadow:0 1px 0 #a55a00; }
</style>
</head>
<body>
<div id="stage">
  <div id="col">
    <div id="hud">
      <div class="item"><span class="label">SCORE</span><span class="value" id="score">0</span></div>
      <div class="item mid"><span class="label">STAGE</span><span class="value" id="stageNo">1</span></div>
      <div class="item right">
        <span class="label">BEST</span><span class="value" id="best">0</span>
      </div>
      <div class="icons">
        <button id="muteBtn" title="소리 (M)">🔊</button>
        <button id="pauseBtn" title="일시정지 (P)">⏸</button>
      </div>
    </div>
    <div id="wrap">
      <canvas id="game"></canvas>
      <div id="overlay">
        <h1>퍼즐 버블</h1>
        <p>같은 색 구슬을 <b>3개 이상</b> 붙여서 터뜨리세요!<br>매달린 구슬까지 떨어뜨리면 보너스 점수 💥</p>
        <div class="help">
          🖱️ 마우스로 조준 · 클릭 발사<br>
          📱 드래그로 조준 · 손을 떼면 발사<br>
          ⌨️ ← → 조준 · Space 발사 · ↓ 구슬 교체<br>
          NEXT 구슬을 누르면 바꿀 수 있어요
        </div>
        <button id="startBtn">시작하기</button>
      </div>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
